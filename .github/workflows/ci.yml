name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @kotilo/kit-cli build
      - name: CLI smoke test
        shell: bash
        run: |
          out=$(echo 'aGVsbG8gS290aWxvIQ==' | node apps/cli/dist/kotilo.cjs base64 decode)
          test "$out" = "hello Kotilo!"
