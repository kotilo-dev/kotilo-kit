[package]
name = "kotilo-kit"
version = "1.0.2"
description = "Kotilo Kit — offline developer toolbox"
authors = ["Kotilo"]
license = "MIT"
repository = "https://github.com/kotilo-dev/kotilo-kit"
edition = "2021"
rust-version = "1.77"

[lib]
name = "kotilo_kit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sys-locale = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
