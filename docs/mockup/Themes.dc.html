<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kotilo Kit — Tema ayarları</title>
<script src="./support.js"></script>
<script src="themes.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
a{color:#89b4fa}a:hover{color:#b4befe}
</style>
</helmet>
<div style="{{vars}}; width: 1280px; height: 800px; box-sizing: border-box; background: var(--base); border-radius: 12px; border: 1px solid var(--s1); display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; color: var(--text); overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--mantle); border-bottom: 1px solid var(--s0)">
    <span style="display: flex; gap: 7px; margin-right: 8px"><span style="width: 11px; height: 11px; border-radius: 50%; background: var(--red)"></span><span style="width: 11px; height: 11px; border-radius: 50%; background: var(--yellow)"></span><span style="width: 11px; height: 11px; border-radius: 50%; background: var(--green)"></span></span>
    <span style="font-size: 13px; font-weight: 600">Kotilo Kit</span>
    <span style="color: var(--overlay)">/</span>
    <span style="font-size: 13px; color: var(--subtext)">Ayarlar</span>
    <span style="color: var(--overlay)">/</span>
    <span style="font-size: 13px; color: var(--text)">Görünüm</span>
  </div>

  <div style="display: flex; flex: 1; min-height: 0">
    <nav aria-label="Ayarlar" style="width: 232px; box-sizing: border-box; padding: 12px 10px; border-right: 1px solid var(--s0); background: var(--mantle); display: flex; flex-direction: column; gap: 2px; font-size: 13px">
      <a href="#" style="padding: 7px 10px; border-radius: 7px; color: var(--subtext); text-decoration: none">Genel</a>
      <a href="#" style="padding: 7px 10px; border-radius: 7px; background: var(--s0); color: var(--text); text-decoration: none; font-weight: 500">Görünüm</a>
      <a href="#" style="padding: 7px 10px; border-radius: 7px; color: var(--subtext); text-decoration: none">Kısayollar</a>
      <a href="#" style="padding: 7px 10px; border-radius: 7px; color: var(--subtext); text-decoration: none">Pano algılama</a>
      <a href="#" style="padding: 7px 10px; border-radius: 7px; color: var(--subtext); text-decoration: none">Eklentiler</a>
      <a href="#" style="padding: 7px 10px; border-radius: 7px; color: var(--subtext); text-decoration: none">Pipeline'lar</a>
      <a href="#" style="padding: 7px 10px; border-radius: 7px; color: var(--subtext); text-decoration: none">Gizlilik</a>
      <a href="#" style="padding: 7px 10px; border-radius: 7px; color: var(--subtext); text-decoration: none">Hakkında</a>
    </nav>

    <main style="flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 24px 28px; gap: 20px; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 14px">
        <h1 style="margin: 0; font-size: 20px; font-weight: 600">Tema</h1>
        <span style="flex: 1"></span>
        <label style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--subtext)"><input type="checkbox" checked style="accent-color: var(--blue); width: 14px; height: 14px">Sistem açık/koyu modunu izle</label>
        <button style="padding: 6px 12px; border-radius: 7px; border: 1px solid var(--s0); background: var(--mantle); color: var(--subtext); font-size: 12px; cursor: pointer">Tema içe aktar (.toml)</button>
      </div>

      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px">
        <sc-for list="{{themes}}" as="t" hint-placeholder-count="7">
          <button style="text-align: left; padding: 0; border: 2px solid {{t.border}}; border-radius: 12px; background: var(--mantle); cursor: pointer; overflow: hidden; display: flex; flex-direction: column">
            <span style="display: block; padding: 12px; background: {{t.base}}; border-bottom: 1px solid {{t.s0}}">
              <span style="display: flex; gap: 6px; margin-bottom: 8px"><span style="width: 36px; height: 6px; border-radius: 3px; background: {{t.text}}"></span><span style="width: 56px; height: 6px; border-radius: 3px; background: {{t.subtext}}"></span></span>
              <span style="display: flex; gap: 5px"><span style="width: 16px; height: 16px; border-radius: 4px; background: {{t.blue}}"></span><span style="width: 16px; height: 16px; border-radius: 4px; background: {{t.mauve}}"></span><span style="width: 16px; height: 16px; border-radius: 4px; background: {{t.green}}"></span><span style="width: 16px; height: 16px; border-radius: 4px; background: {{t.yellow}}"></span><span style="width: 16px; height: 16px; border-radius: 4px; background: {{t.peach}}"></span><span style="width: 16px; height: 16px; border-radius: 4px; background: {{t.red}}"></span><span style="width: 16px; height: 16px; border-radius: 4px; background: {{t.teal}}"></span></span>
            </span>
            <span style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; font-size: 13px; color: var(--text); font-weight: 500"><span style="flex: 1">{{t.name}}</span><span style="font: 400 11px JetBrains Mono, monospace; color: var(--overlay)">{{t.id}}</span></span>
          </button>
        </sc-for>
        <div style="border: 2px dashed var(--s1); border-radius: 12px; display: flex; align-items: center; justify-content: center; min-height: 104px; font-size: 13px; color: var(--overlay)">+ Özel tema</div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
        <section style="border: 1px solid var(--s0); border-radius: 10px; background: var(--mantle); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
          <h2 style="margin: 0; font-size: 13px; font-weight: 600">Yazı tipi</h2>
          <label style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--subtext)"><span style="width: 110px">Monospace</span><select style="flex: 1; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--s1); background: var(--base); color: var(--text); font-size: 12px"><option>JetBrains Mono</option><option>Fira Code</option><option>Cascadia Code</option><option>Iosevka</option></select></label>
          <label style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--subtext)"><span style="width: 110px">Boyut</span><input type="range" min="11" max="18" value="13" style="flex: 1; accent-color: var(--blue)"><span style="font: 400 12px JetBrains Mono, monospace; color: var(--text); width: 28px">13</span></label>
          <label style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--subtext)"><input type="checkbox" checked style="accent-color: var(--blue); width: 14px; height: 14px">Ligature'ları aç</label>
        </section>
        <section style="border: 1px solid var(--s0); border-radius: 10px; background: var(--mantle); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
          <h2 style="margin: 0; font-size: 13px; font-weight: 600">Pencere</h2>
          <label style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--subtext)"><span style="width: 110px">Palette opaklığı</span><input type="range" min="60" max="100" value="96" style="flex: 1; accent-color: var(--blue)"><span style="font: 400 12px JetBrains Mono, monospace; color: var(--text); width: 28px">96</span></label>
          <label style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--subtext)"><span style="width: 110px">Köşe yarıçapı</span><input type="range" min="0" max="16" value="12" style="flex: 1; accent-color: var(--blue)"><span style="font: 400 12px JetBrains Mono, monospace; color: var(--text); width: 28px">12</span></label>
          <label style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--subtext)"><input type="checkbox" style="accent-color: var(--blue); width: 14px; height: 14px">Kompakt yoğunluk</label>
        </section>
      </div>
    </main>
  </div>

  <div style="display: flex; align-items: center; gap: 16px; padding: 6px 16px; background: var(--crust); border-top: 1px solid var(--s0); font: 400 11px JetBrains Mono, monospace; color: var(--overlay)">
    <span style="display: flex; align-items: center; gap: 6px"><span style="width: 6px; height: 6px; border-radius: 50%; background: var(--green)"></span>çevrimdışı · ağ yok · telemetri yok</span>
    <span>{{themeName}}</span>
    <span style="flex: 1"></span>
    <span>ayarlar: ~/.config/kotilo/kit/config.toml</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"catppuccin-mocha","options":["catppuccin-mocha","gruvbox-dark","tokyo-night","everforest-dark","nord","rose-pine-moon","dracula"],"section":"Tema"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    var id = this.props.theme || 'catppuccin-mocha';
    var all = window.KotiloThemes;
    var cur = all[id] || all['catppuccin-mocha'];
    var themes = Object.keys(all).map(function (k) {
      var t = all[k];
      return Object.assign({ id: k, border: k === id ? cur.blue : cur.s0 }, t);
    });
    return { vars: window.kotiloThemeVars(id), themeName: cur.name, themes: themes };
  }
}
</script>
</body>
</html>
