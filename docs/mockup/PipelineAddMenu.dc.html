<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kotilo Kit — Pipeline'a ekle</title>
<script src="./support.js"></script>
<script src="themes.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
a{color:#89b4fa}a:hover{color:#b4befe}
</style>
</helmet>
<div style="{{vars}}; width: 560px; height: 380px; box-sizing: border-box; background: var(--base); border-radius: 12px; border: 1px solid var(--s1); font-family: Inter, system-ui, sans-serif; color: var(--text); overflow: hidden; padding: 20px 24px; display: flex; flex-direction: column; gap: 10px">

  <div style="display: flex; align-items: center; gap: 14px">
    <h1 style="margin: 0; font-size: 20px; font-weight: 600">Base64</h1>
    <div role="group" aria-label="Mod" style="display: flex; background: var(--mantle); border: 1px solid var(--s0); border-radius: 8px; padding: 3px; font-size: 12px">
      <button style="padding: 5px 14px; border-radius: 6px; border: none; background: transparent; color: var(--subtext); cursor: pointer">Encode</button>
      <button aria-pressed="true" style="padding: 5px 14px; border-radius: 6px; border: none; background: var(--blue); color: var(--crust); font-weight: 600; cursor: pointer">Decode</button>
    </div>
    <span style="flex: 1"></span>
    <button aria-expanded="true" aria-haspopup="menu" style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 7px; border: 1px solid var(--blue); background: var(--s0); color: var(--text); font-size: 12px; cursor: pointer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2" aria-hidden="true"><path d="M4 14l6-6 4 4 6-6"/><path d="M14 6h6v6"/></svg>Pipeline'a ekle</button>
  </div>

  <div style="display: flex; justify-content: flex-end">
    <div role="menu" aria-label="Pipeline'a ekle" style="width: 340px; border: 1px solid var(--s1); border-radius: 10px; background: var(--mantle); box-shadow: 0 12px 32px rgba(0,0,0,0.4); overflow: hidden; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--s0)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--overlay)" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input aria-label="Pipeline ara" placeholder="Pipeline ara…" style="flex: 1; background: transparent; border: none; outline: none; font-size: 12px; color: var(--text)">
      </div>
      <div style="padding: 6px">
        <button role="menuitem" style="width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; border: none; background: var(--s0); color: var(--text); font-size: 13px; text-align: left; cursor: pointer">
          <span style="font: 500 13px JetBrains Mono, monospace; color: var(--blue); width: 12px">+</span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 500">Yeni pipeline</span><span style="font-size: 11px; color: var(--subtext)">Base64 · decode ile başlar</span></span>
          <span style="font: 500 10px JetBrains Mono, monospace; color: var(--crust); background: var(--blue); padding: 2px 6px; border-radius: 5px">enter</span>
        </button>
        <div style="font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: var(--overlay); padding: 10px 10px 4px">SONUNA EKLE</div>
        <button role="menuitem" style="width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; border: none; background: transparent; color: var(--text); font-size: 13px; text-align: left; cursor: pointer">
          <span style="width: 8px; height: 8px; box-sizing: border-box; border-radius: 2px; border: 1.5px solid var(--subtext); margin: 0 2px"></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-family: JetBrains Mono, monospace; font-size: 12px">jwt-scopes</span><span style="font-size: 11px; color: var(--subtext)">Base64 → JSON → Case · 3 adım</span></span>
        </button>
        <button role="menuitem" style="width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; border: none; background: transparent; color: var(--text); font-size: 13px; text-align: left; cursor: pointer">
          <span style="width: 8px; height: 8px; box-sizing: border-box; border-radius: 2px; border: 1.5px solid var(--subtext); margin: 0 2px"></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-family: JetBrains Mono, monospace; font-size: 12px">csv-to-md</span><span style="font-size: 11px; color: var(--subtext)">CSV → Satır işlemleri · 2 adım</span></span>
        </button>
      </div>
      <div style="padding: 8px 12px; background: var(--crust); border-top: 1px solid var(--s0); font: 400 11px JetBrains Mono, monospace; color: var(--overlay)">↵ ekle · seçili seçenekler adımla taşınır</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"catppuccin-mocha","options":["catppuccin-mocha","gruvbox-dark","tokyo-night","everforest-dark","nord","rose-pine-moon","dracula"],"section":"Tema"},"$preview":{"width":560,"height":380}}'>
class Component extends DCLogic {
  renderVals() {
    var id = this.props.theme || 'catppuccin-mocha';
    return { vars: window.kotiloThemeVars(id) };
  }
}
</script>
</body>
</html>
